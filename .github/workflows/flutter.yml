name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  pr-metadata:
    name: PR conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { title, body } = context.payload.pull_request;
            const conventionalTitle = /^(feat|fix|docs|test|refactor|ci|chore)(\([a-z0-9-]+\))?!?: \S.+$/;
            const issueReference = /\b(?:Closes|Fixes|Resolves|Refs)\s+#\d+\b/i;
            if (!conventionalTitle.test(title)) {
              core.setFailed('Use a Conventional Commit PR title, e.g. feat(journal): persist entries');
            }
            if (!issueReference.test(body || '')) {
              core.setFailed('Link an issue in the PR body with Closes #123 or Refs #123.');
            }